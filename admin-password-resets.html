<!DOCTYPE html>
<html>
<head>
<title>Password Resets - Prime Arena Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e27;color:white;font-family:'Arial',sans-serif;padding-bottom:80px;min-height:100vh}
.topbar{display:flex;align-items:center;padding:15px;background:#0d1230;border-bottom:1px solid #2a2f4a;position:sticky;top:0;z-index:100;gap:15px}
.back-btn{font-size:24px;color:white;cursor:pointer}
.topbar-title{font-size:16px;font-weight:bold;display:flex;align-items:center;gap:8px}
.admin-badge{background:linear-gradient(135deg,#ff6b00,#ffa500);color:white;font-size:10px;padding:3px 8px;border-radius:10px;font-weight:bold}
.refresh-btn{background:#2a2f4a;border:none;color:#fff;padding:8px 12px;border-radius:6px;font-size:16px;cursor:pointer;margin-left:auto}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:15px}
.stat{background:#1a1f3a;border:1px solid #2a2f4a;border-radius:10px;padding:12px;text-align:center}
.stat .lbl{font-size:9px;color:#666;margin-bottom:4px}
.stat .val{font-size:20px;font-weight:bold}
.stat.pending .val{color:#ffa500}
.stat.completed .val{color:#00c853}
.stat.total .val{color:#fff}
.filter-tabs{display:flex;padding:0 15px 15px;gap:8px;overflow-x:auto}
.filter-tab{padding:10px 18px;background:#1a1f3a;border:1px solid #2a2f4a;border-radius:20px;font-size:12px;color:#ccc;cursor:pointer;white-space:nowrap;font-weight:bold}
.filter-tab.active{background:linear-gradient(135deg,#ff6b00,#ffa500);color:white;border-color:#ffa500}
.req-list{padding:0 15px}
.req-card{background:#1a1f3a;border-radius:12px;padding:15px;margin-bottom:12px;border:1px solid #2a2f4a;border-left:4px solid #ffa500}
.req-card.completed{border-left-color:#00c853;opacity:.7}
.req-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.req-name{font-size:15px;font-weight:bold;color:#fff}
.req-status{font-size:10px;padding:4px 10px;border-radius:10px;font-weight:bold;text-transform:uppercase}
.status-pending{background:#ffa500;color:#0a0e27}
.status-completed{background:#00c853;color:white}
.req-details{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:12px}
.detail-row{display:flex;justify-content:space-between;gap:10px}
.detail-label{color:#666}
.detail-value{color:#ccc;font-weight:500;word-break:break-all;text-align:right;max-width:65%}
.detail-value.email{color:#00e676}
.detail-value.phone{color:#00aaff;font-family:monospace}
.password-box{background:#0a0e27;border:1px solid #2a2f4a;border-radius:10px;padding:12px;margin-bottom:12px}
.password-box label{display:block;font-size:10px;color:#aaa;margin-bottom:6px;font-weight:bold;letter-spacing:.5px}
.password-box input{width:100%;padding:12px;background:#0f121d;border:1px solid #2a2f4a;border-radius:8px;color:#fff;font-size:14px;outline:none;font-family:monospace}
.password-box input:focus{border-color:#00c853}
.password-box .hint{font-size:10px;color:#666;margin-top:5px}
.action-btn{width:100%;padding:12px;background:linear-gradient(135deg,#00c853,#00e676);border:none;border-radius:8px;color:white;font-size:13px;font-weight:bold;cursor:pointer;text-transform:uppercase}
.action-btn:disabled{opacity:.5;cursor:not-allowed}
.empty{text-align:center;padding:60px 20px;color:#666}
.empty .ic{font-size:60px;opacity:.5;margin-bottom:15px}
.empty .t1{font-size:15px;margin-bottom:5px}
.empty .t2{font-size:12px;color:#444}
.loading{text-align:center;color:#ffa500;padding:30px;font-size:14px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#00c853;color:white;padding:12px 25px;border-radius:25px;font-size:13px;font-weight:bold;display:none;z-index:1000;max-width:90%;text-align:center}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0d1230;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #2a2f4a;z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:#666;font-size:9px;padding:5px 8px;flex:1}
.nav-item.active{color:#ffa500}
.nav-icon{font-size:20px}
.popup-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:9999;justify-content:center;align-items:center;padding:20px}
.popup-overlay.show{display:flex}
.popup-box{background:#0f121d;border:1px solid #d4af37;border-radius:14px;padding:25px 20px;width:100%;max-width:360px;text-align:center}
.popup-icon{font-size:45px;margin-bottom:12px}
.popup-title{color:#fca311;font-size:19px;font-weight:bold;margin-bottom:10px}
.popup-msg{color:#ccc;font-size:14px;line-height:1.6;margin-bottom:20px;white-space:pre-line}
.popup-buttons{display:flex;gap:10px}
.popup-btn{flex:1;padding:13px;border:none;border-radius:10px;font-weight:bold;font-size:14px;cursor:pointer;text-transform:uppercase}
.popup-btn-cancel{background:#2a2d3e;color:#fff}
.popup-btn-confirm{background:linear-gradient(135deg,#00c853,#00e676);color:#fff}
.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);display:none;justify-content:center;align-items:center;flex-direction:column;z-index:99999}
.loading-overlay.show{display:flex}
.spinner{width:60px;height:60px;border:5px solid #1a1f3a;border-top-color:#ffa500;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:#ffa500;font-size:14px;font-weight:bold}
</style>
</head>
<body>
<div class="topbar">
<div class="back-btn" onclick="location.href='admin.html'">←</div>
<div class="topbar-title">Password Resets<span class="admin-badge">ADMIN</span></div>
<button class="refresh-btn" onclick="loadRequests()">↻</button>
</div>

<div class="stats">
<div class="stat pending"><div class="lbl">PENDING</div><div class="val" id="statPending">0</div></div>
<div class="stat completed"><div class="lbl">COMPLETED</div><div class="val" id="statCompleted">0</div></div>
<div class="stat total"><div class="lbl">TOTAL</div><div class="val" id="statTotal">0</div></div>
</div>

<div class="filter-tabs">
<div class="filter-tab active" onclick="filterReqs('pending',this)">Pending</div>
<div class="filter-tab" onclick="filterReqs('completed',this)">Completed</div>
<div class="filter-tab" onclick="filterReqs('all',this)">All</div>
</div>

<div class="req-list" id="reqList">
<div class="loading">Loading requests...</div>
</div>

<div class="toast" id="toast">Success!</div>

<div class="popup-overlay" id="customPopup">
<div class="popup-box">
<div class="popup-icon" id="popupIcon">⚠️</div>
<div class="popup-title" id="popupTitle">Confirm</div>
<div class="popup-msg" id="popupMsg">Message</div>
<div class="popup-buttons" id="popupButtons"></div>
</div>
</div>

<div class="loading-overlay" id="loadingOverlay">
<div class="spinner"></div>
<div class="loading-text">Processing...</div>
</div>

<div class="bottom-nav">
<div class="nav-item" onclick="location.href='admin.html'"><span class="nav-icon">🏠</span><span>Dashboard</span></div>
<div class="nav-item" onclick="location.href='admin-users.html'"><span class="nav-icon">👥</span><span>Users</span></div>
<div class="nav-item" onclick="location.href='admin-deposits.html'"><span class="nav-icon">💳</span><span>Deposits</span></div>
<div class="nav-item" onclick="location.href='admin-withdrawals.html'"><span class="nav-icon">💸</span><span>Withdrawals</span></div>
<div class="nav-item" onclick="location.href='admin-settings.html'"><span class="nav-icon">⚙️</span><span>Settings</span></div>
</div>

<script>
var firebaseConfig={apiKey:"AIzaSyC22oO0eveUN3GL9WNtJSzdKghN-X67ZmU",authDomain:"prime-arena-a302b.firebaseapp.com",projectId:"prime-arena-a302b",storageBucket:"prime-arena-a302b.firebasestorage.app",messagingSenderId:"118236794000",appId:"1:118236794000:web:cd0e5bf7503b72f1cf5c15",measurementId:"G-EQJP1D9C92"};

if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();

var currentFilter='pending';
var allRequests=[];

function esc(s){
if(s===undefined||s===null)return '';
return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg,bg){
var t=document.getElementById('toast');
t.textContent=msg;
t.style.background=bg||'#00c853';
t.style.display='block';
setTimeout(function(){t.style.display='none';t.style.background='#00c853';},3000);
}

function showLoading(text){
document.querySelector('.loading-text').textContent=text||'Processing...';
document.getElementById('loadingOverlay').classList.add('show');
}
function hideLoading(){
document.getElementById('loadingOverlay').classList.remove('show');
}

function showConfirm(icon,title,msg,btnLabel,btnClass,callback){
document.getElementById('popupIcon').textContent=icon;
document.getElementById('popupTitle').textContent=title;
document.getElementById('popupMsg').textContent=msg;
var btnRow=document.getElementById('popupButtons');
btnRow.innerHTML='';
var cancelBtn=document.createElement('button');
cancelBtn.textContent='CANCEL';
cancelBtn.className='popup-btn popup-btn-cancel';
cancelBtn.onclick=function(){document.getElementById('customPopup').classList.remove('show');};
var confirmBtn=document.createElement('button');
confirmBtn.textContent=btnLabel;
confirmBtn.className='popup-btn '+(btnClass||'popup-btn-confirm');
confirmBtn.onclick=function(){document.getElementById('customPopup').classList.remove('show');if(callback)callback();};
btnRow.appendChild(cancelBtn);
btnRow.appendChild(confirmBtn);
document.getElementById('customPopup').classList.add('show');
}

function showAlert(icon,title,msg){
document.getElementById('popupIcon').textContent=icon;
document.getElementById('popupTitle').textContent=title;
document.getElementById('popupMsg').textContent=msg;
var btnRow=document.getElementById('popupButtons');
btnRow.innerHTML='';
var okBtn=document.createElement('button');
okBtn.textContent='OK';
okBtn.className='popup-btn popup-btn-confirm';
okBtn.onclick=function(){document.getElementById('customPopup').classList.remove('show');};
btnRow.appendChild(okBtn);
document.getElementById('customPopup').classList.add('show');
}

function fmtTime(iso){
if(!iso)return '-';
try{
var d=new Date(iso);
return d.toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
}catch(e){return '-';}
}

function loadRequests(){
document.getElementById('reqList').innerHTML='<div class="loading">Loading requests...</div>';
db.collection('password_reset_requests').get().then(function(snap){
allRequests=[];
snap.forEach(function(doc){
var d=doc.data();
d.id=doc.id;
allRequests.push(d);
});
allRequests.sort(function(a,b){
return new Date(b.createdAt||0)-new Date(a.createdAt||0);
});
updateStats();
displayReqs();
}).catch(function(e){
document.getElementById('reqList').innerHTML='<div class="empty"><div class="ic">X</div><div class="t1">Error: '+esc(e.message)+'</div></div>';
});
}

function updateStats(){
var p=0,c=0;
allRequests.forEach(function(r){
if(r.status==='pending')p++;
else if(r.status==='completed')c++;
});
document.getElementById('statPending').textContent=p;
document.getElementById('statCompleted').textContent=c;
document.getElementById('statTotal').textContent=allRequests.length;
}

function filterReqs(f,el){
currentFilter=f;
document.querySelectorAll('.filter-tab').forEach(function(t){t.classList.remove('active');});
el.classList.add('active');
displayReqs();
}

function displayReqs(){
var list=document.getElementById('reqList');
var filtered=allRequests.filter(function(r){
if(currentFilter==='all')return true;
return r.status===currentFilter;
});

if(filtered.length===0){
list.innerHTML='<div class="empty"><div class="ic">🔐</div><div class="t1">No Requests</div><div class="t2">No '+currentFilter+' password reset requests.</div></div>';
return;
}

var html='';
filtered.forEach(function(r){
var status=r.status||'pending';
var cardClass=status==='completed'?'completed':'';

var actionHtml='';
if(status==='pending'){
actionHtml='<div class="password-box">'+
'<label>🔑 SET NEW PASSWORD</label>'+
'<input type="text" id="pwd-'+r.id+'" placeholder="e.g. NewPass123" value="">'+
'<div class="hint">User को यह password बताएं ताकि वो login कर सके</div>'+
'</div>'+
'<button class="action-btn" onclick="resetPassword(\''+r.id+'\')">RESET PASSWORD</button>';
}else{
actionHtml='<div style="text-align:center;color:#00c853;font-size:12px;padding:8px">✅ Completed on '+fmtTime(r.completedAt)+'</div>';
}

html+='<div class="req-card '+cardClass+'">'+
'<div class="req-header">'+
'<div class="req-name">'+esc(r.userName||'Unknown')+'</div>'+
'<div class="req-status status-'+status+'">'+status+'</div>'+
'</div>'+
'<div class="req-details">'+
'<div class="detail-row"><span class="detail-label">Email:</span><span class="detail-value email">'+esc(r.email||'-')+'</span></div>'+
'<div class="detail-row"><span class="detail-label">Phone:</span><span class="detail-value phone">'+esc(r.phone||'-')+'</span></div>'+
'<div class="detail-row"><span class="detail-label">Requested:</span><span class="detail-value">'+fmtTime(r.createdAt)+'</span></div>'+
'</div>'+
actionHtml+
'</div>';
});

list.innerHTML=html;
}

function resetPassword(id){
var r=allRequests.find(function(x){return x.id===id;});
if(!r){showAlert('❌','Error','Request not found.');return;}

var input=document.getElementById('pwd-'+id);
if(!input){showAlert('❌','Error','Input not found.');return;}

var newPwd=input.value.trim();

if(!newPwd||newPwd.length<6){
showAlert('⚠️','Invalid Password','Password must be at least 6 characters.');
return;
}

showConfirm('🔑','Reset Password?','Reset '+r.userName+'\'s password to:\n\n"'+newPwd+'"\n\nUser को यह password बताएं।','RESET','popup-btn-confirm',function(){
showLoading('Resetting password...');

// Update user's password
db.collection('users').doc(r.userId).get().then(function(userSnap){
if(!userSnap.exists){
throw new Error('USER_NOT_FOUND');
}
return db.collection('users').doc(r.userId).update({
password:newPwd,
passwordUpdatedAt:new Date().toISOString()
});
}).then(function(){
return db.collection('password_reset_requests').doc(id).update({
status:'completed',
completedAt:new Date().toISOString(),
newPassword:newPwd
});
}).then(function(){
hideLoading();
showToast('✅ Password Reset! User को बताएं: '+newPwd,'linear-gradient(135deg,#00c853,#00e676)');
loadRequests();
}).catch(function(e){
hideLoading();
if(e.message==='USER_NOT_FOUND'){
showAlert('❌','User Not Found','User does not exist. Password not reset.');
}else{
showAlert('❌','Error',e.message);
}
});
});
}

document.getElementById('customPopup').addEventListener('click',function(e){
if(e.target===this)this.classList.remove('show');
});

loadRequests();
</script>
</body>
  </html>
