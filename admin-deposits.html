<!DOCTYPE html>
<html>
<head>
  <title>Deposit Management - Prime Arena Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0e27; color: white; font-family: 'Arial', sans-serif; padding-bottom: 80px; min-height: 100vh; }
    .topbar { display: flex; align-items: center; padding: 15px; background: #0d1230; border-bottom: 1px solid #2a2f4a; position: sticky; top: 0; z-index: 100; gap: 15px; }
    .back-btn { font-size: 24px; color: white; cursor: pointer; }
    .topbar-title { font-size: 16px; font-weight: bold; color: white; display: flex; align-items: center; gap: 8px; }
    .admin-badge { background: linear-gradient(135deg, #ff6b00, #ffa500); color: white; font-size: 10px; padding: 3px 8px; border-radius: 10px; font-weight: bold; }
    .refresh-btn { background: #2a2f4a; border: none; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 16px; cursor: pointer; margin-left: auto; }
    .filter-tabs { display: flex; padding: 15px; gap: 8px; overflow-x: auto; }
    .filter-tab { padding: 10px 18px; background: #1a1f3a; border: 1px solid #2a2f4a; border-radius: 20px; font-size: 12px; color: #ccc; cursor: pointer; white-space: nowrap; font-weight: bold; }
    .filter-tab.active { background: linear-gradient(135deg, #ff6b00, #ffa500); color: white; border-color: #ffa500; }
    .deposit-list { padding: 0 15px; }
    .deposit-card { background: #1a1f3a; border-radius: 12px; padding: 15px; margin-bottom: 12px; border: 1px solid #2a2f4a; border-left: 4px solid #ffa500; }
    .deposit-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .deposit-amount { font-size: 22px; font-weight: bold; color: #00c853; }
    .deposit-status { font-size: 10px; padding: 4px 10px; border-radius: 10px; font-weight: bold; text-transform: uppercase; }
    .status-pending { background: #ffa500; color: #0a0e27; }
    .status-approved { background: #00c853; color: white; }
    .status-rejected { background: #ff3131; color: white; }
    .deposit-details { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; font-size: 12px; }
    .detail-row { display: flex; justify-content: space-between; }
    .detail-label { color: #666; }
    .detail-value { color: #ccc; font-weight: 500; word-break: break-all; text-align: right; max-width: 60%; }
    .detail-value.utr { color: #ffa500; font-family: monospace; letter-spacing: 1px; }
    .detail-value.warning { color: #ff3131; font-weight: bold; }
    .detail-value.safe { color: #00e676; font-weight: bold; }
    .action-buttons { display: flex; gap: 10px; }
    .approve-btn { flex: 1; padding: 12px; background: linear-gradient(135deg, #00c853, #00e676); border: none; border-radius: 8px; color: white; font-size: 13px; font-weight: bold; cursor: pointer; }
    .approve-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .reject-btn { flex: 1; padding: 12px; background: linear-gradient(135deg, #ff3131, #ff5252); border: none; border-radius: 8px; color: white; font-size: 13px; font-weight: bold; cursor: pointer; }
    .reject-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .empty-state { text-align: center; padding: 60px 20px; color: #666; }
    .empty-icon { font-size: 60px; margin-bottom: 15px; opacity: 0.5; }
    .empty-text { font-size: 15px; margin-bottom: 5px; }
    .empty-subtext { font-size: 12px; color: #444; }
    .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #00c853; color: white; padding: 12px 25px; border-radius: 25px; font-size: 13px; font-weight: bold; display: none; z-index: 1000; max-width: 90%; text-align: center; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0d1230; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #2a2f4a; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; color: #666; font-size: 9px; padding: 5px 8px; flex: 1; }
    .nav-item.active { color: #ffa500; }
    .nav-icon { font-size: 20px; }
    .popup-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; padding: 20px; }
    .popup-overlay.show { display: flex; }
    .popup-box { background: #0f121d; border: 1px solid #d4af37; border-radius: 14px; padding: 25px 20px; width: 100%; max-width: 360px; text-align: center; }
    .popup-icon { font-size: 45px; margin-bottom: 12px; line-height: 1; }
    .popup-title { color: #fca311; font-size: 19px; font-weight: bold; margin-bottom: 10px; }
    .popup-msg { color: #ccc; font-size: 14px; line-height: 1.6; margin-bottom: 20px; white-space: pre-line; }
    .popup-buttons { display: flex; gap: 10px; }
    .popup-btn { flex: 1; padding: 13px; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; text-transform: uppercase; }
    .popup-btn-cancel { background: #2a2d3e; color: #fff; }
    .popup-btn-confirm { background: linear-gradient(135deg,#00c853,#00e676); color: #fff; }
    .popup-btn-danger { background: linear-gradient(135deg,#ff3131,#ff5252); color: #fff; }
    .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 99999; }
    .loading-overlay.show { display: flex; }
    .spinner { width: 60px; height: 60px; border: 5px solid #1a1f3a; border-top-color: #ffa500; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #ffa500; font-size: 14px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="back-btn" onclick="window.location.href='admin.html'">←</div>
    <div class="topbar-title">
      Deposit Management
      <span class="admin-badge">ADMIN</span>
    </div>
    <button class="refresh-btn" onclick="loadDeposits()">↻</button>
  </div>

  <div class="filter-tabs">
    <div class="filter-tab active" onclick="filterDeposits('pending', this)">Pending</div>
    <div class="filter-tab" onclick="filterDeposits('approved', this)">Approved</div>
    <div class="filter-tab" onclick="filterDeposits('rejected', this)">Rejected</div>
    <div class="filter-tab" onclick="filterDeposits('all', this)">All</div>
  </div>

  <div class="deposit-list" id="depositList">
    <div class="empty-state">
      <div class="empty-icon">⏳</div>
      <div class="empty-text">Loading deposits...</div>
    </div>
  </div>

  <div class="toast" id="toast">Success!</div>

  <div class="popup-overlay" id="customPopup">
    <div class="popup-box">
      <div class="popup-icon" id="popupIcon">⚠️</div>
      <div class="popup-title" id="popupTitle">Confirm</div>
      <div class="popup-msg" id="popupMsg">Message</div>
      <div class="popup-buttons" id="popupButtons"></div>
    </div>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Processing...</div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item" onclick="window.location.href='admin.html'"><span class="nav-icon">🏠</span><span>Dashboard</span></div>
    <div class="nav-item" onclick="window.location.href='admin-users.html'"><span class="nav-icon">👥</span><span>Users</span></div>
    <div class="nav-item active" onclick="window.location.href='admin-deposits.html'"><span class="nav-icon">💳</span><span>Deposits</span></div>
    <div class="nav-item" onclick="window.location.href='admin-withdrawals.html'"><span class="nav-icon">💸</span><span>Withdrawals</span></div>
    <div class="nav-item" onclick="window.location.href='admin-settings.html'"><span class="nav-icon">⚙️</span><span>Settings</span></div>
  </div>
    <script>
    var firebaseConfig = {
      apiKey: "AIzaSyC22oO0eveUN3GL9WNtJSzdKghN-X67ZmU",
      authDomain: "prime-arena-a302b.firebaseapp.com",
      projectId: "prime-arena-a302b",
      storageBucket: "prime-arena-a302b.firebasestorage.app",
      messagingSenderId: "118236794000",
      appId: "1:118236794000:web:cd0e5bf7503b72f1cf5c15",
      measurementId: "G-EQJP1D9C92"
    };

    if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(firebaseConfig);
    var db = firebase.firestore();

    var currentFilter = 'pending';
    var allDeposits = [];
    var userBalances = {};

    function esc(s) {
      if (s === undefined || s === null) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function showToast(msg, bg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.style.background = bg || '#00c853';
      t.style.display = 'block';
      setTimeout(function() { t.style.display = 'none'; t.style.background = '#00c853'; }, 3000);
    }

    function showLoading(text) {
      document.getElementById('loadingText').textContent = text || 'Processing...';
      document.getElementById('loadingOverlay').classList.add('show');
    }
    function hideLoading() {
      document.getElementById('loadingOverlay').classList.remove('show');
    }

    function showConfirm(icon, title, msg, btnLabel, btnClass, callback) {
      document.getElementById('popupIcon').textContent = icon;
      document.getElementById('popupTitle').textContent = title;
      document.getElementById('popupMsg').textContent = msg;
      var btnRow = document.getElementById('popupButtons');
      btnRow.innerHTML = '';
      var cancelBtn = document.createElement('button');
      cancelBtn.textContent = 'CANCEL';
      cancelBtn.className = 'popup-btn popup-btn-cancel';
      cancelBtn.onclick = function() { document.getElementById('customPopup').classList.remove('show'); };
      var confirmBtn = document.createElement('button');
      confirmBtn.textContent = btnLabel;
      confirmBtn.className = 'popup-btn ' + (btnClass || 'popup-btn-confirm');
      confirmBtn.onclick = function() { document.getElementById('customPopup').classList.remove('show'); if (callback) callback(); };
      btnRow.appendChild(cancelBtn);
      btnRow.appendChild(confirmBtn);
      document.getElementById('customPopup').classList.add('show');
    }

    function showAlert(icon, title, msg) {
      document.getElementById('popupIcon').textContent = icon;
      document.getElementById('popupTitle').textContent = title;
      document.getElementById('popupMsg').textContent = msg;
      var btnRow = document.getElementById('popupButtons');
      btnRow.innerHTML = '';
      var okBtn = document.createElement('button');
      okBtn.textContent = 'OK';
      okBtn.className = 'popup-btn popup-btn-confirm';
      okBtn.onclick = function() { document.getElementById('customPopup').classList.remove('show'); };
      btnRow.appendChild(okBtn);
      document.getElementById('customPopup').classList.add('show');
    }

    function fmtTime(iso) {
      if (!iso) return '-';
      try {
        var d = new Date(iso);
        return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
      } catch (e) { return iso; }
    }

    async function loadUserBalances() {
      var uids = [];
      allDeposits.forEach(function(d) {
        if (d.userId && uids.indexOf(d.userId) === -1) uids.push(d.userId);
      });
      var promises = uids.map(function(uid) {
        return db.collection('users').doc(uid).get().then(function(doc) {
          if (doc.exists) {
            var d = doc.data();
            userBalances[uid] = {
              exists: true,
              name: d.name || 'Unknown',
              email: d.email || '-',
              balance: d.balance || 0,
              deposited: d.deposited || 0,
              winning: d.winning || 0
            };
          } else {
            userBalances[uid] = { exists: false };
          }
        }).catch(function() {
          userBalances[uid] = { exists: false };
        });
      });
      await Promise.all(promises);
    }

    function loadDeposits() {
      document.getElementById('depositList').innerHTML = '<div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-text">Loading deposits...</div></div>';
      db.collection("deposits").get().then(function(querySnapshot) {
        allDeposits = [];
        querySnapshot.forEach(function(doc) {
          var data = doc.data();
          data.id = doc.id;
          allDeposits.push(data);
        });
        allDeposits.sort(function(a, b) {
          return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
        });
        return loadUserBalances();
      }).then(function() {
        displayDeposits();
      }).catch(function(error) {
        console.error("Error:", error);
        document.getElementById('depositList').innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><div class="empty-text">Error: ' + esc(error.message) + '</div></div>';
      });
    }

    function displayDeposits() {
      var list = document.getElementById('depositList');
      var filtered = allDeposits.filter(function(d) {
        if (currentFilter === 'all') return true;
        return d.status === currentFilter;
      });

      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">No Deposits Found</div><div class="empty-subtext">No ' + currentFilter + ' deposits yet.</div></div>';
        return;
      }

      var html = '';
      filtered.forEach(function(d) {
        var u = userBalances[d.userId] || { exists: false };
        var userName = (u.exists && u.name) ? u.name : (d.userName || 'Unknown');
        var userEmail = (u.exists && u.email) ? u.email : (d.userEmail || '-');

        var userCheckHtml = '';
        if (d.status === 'pending') {
          if (u.exists) {
            userCheckHtml = '<div class="detail-row"><span class="detail-label">User Status:</span><span class="detail-value safe">✅ User exists</span></div>';
          } else {
            userCheckHtml = '<div class="detail-row"><span class="detail-label">User Status:</span><span class="detail-value warning">⚠️ User NOT FOUND!</span></div>';
          }
        }

        html += '<div class="deposit-card">' +
          '<div class="deposit-header">' +
            '<div class="deposit-amount">₹' + esc(d.amount) + '</div>' +
            '<div class="deposit-status status-' + esc(d.status) + '">' + esc(d.status) + '</div>' +
          '</div>' +
          '<div class="deposit-details">' +
            '<div class="detail-row"><span class="detail-label">User:</span><span class="detail-value">' + esc(userName) + '</span></div>' +
            '<div class="detail-row"><span class="detail-label">Email:</span><span class="detail-value">' + esc(userEmail) + '</span></div>' +
            '<div class="detail-row"><span class="detail-label">UTR:</span><span class="detail-value utr">' + esc(d.utr) + '</span></div>' +
            '<div class="detail-row"><span class="detail-label">Time:</span><span class="detail-value">' + fmtTime(d.createdAt) + '</span></div>' +
            userCheckHtml +
          '</div>' +
          (d.status === 'pending' ?
            '<div class="action-buttons">' +
              '<button class="approve-btn" data-approve-id="' + d.id + '">✓ APPROVE</button>' +
              '<button class="reject-btn" data-reject-id="' + d.id + '">✗ REJECT</button>' +
            '</div>'
            : '') +
        '</div>';
      });

      list.innerHTML = html;

      list.querySelectorAll('[data-approve-id]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          approveDeposit(this.getAttribute('data-approve-id'));
        });
      });

      list.querySelectorAll('[data-reject-id]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          rejectDeposit(this.getAttribute('data-reject-id'));
        });
      });
    }

    function filterDeposits(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(function(tab) { tab.classList.remove('active'); });
      el.classList.add('active');
      displayDeposits();
    }

    function approveDeposit(id) {
      var deposit = allDeposits.find(function(d) { return d.id === id; });
      if (!deposit) {
        showAlert('❌', 'Error', 'Deposit not found. Please refresh.');
        return;
      }

      if (deposit.status !== 'pending') {
        showAlert('⚠️', 'Already Processed', 'This deposit is already ' + deposit.status + '.');
        loadDeposits();
        return;
      }

      var u = userBalances[deposit.userId];
      if (!u || !u.exists) {
        showAlert('❌', 'User Not Found!', 'Cannot approve. The user with ID "' + deposit.userId + '" does NOT exist in database.\n\nPlease check user manually. This deposit will stay PENDING.');
        return;
      }

      showConfirm(
        '💰',
        'Approve Deposit?',
        'Approve ₹' + deposit.amount + ' for ' + u.name + '?\n\n' +
        'Current Balance: ' + u.balance + '\n' +
        'After Approve: ' + (u.balance + parseInt(deposit.amount)) + '\n\n' +
        'Coins will be added to user wallet.',
        'APPROVE',
        'popup-btn-confirm',
        function() {
          processApproval(deposit, u);
        }
      );
    }

    function processApproval(deposit, u) {
      showLoading('Approving deposit...');

      var uid = deposit.userId;
      var amt = parseInt(deposit.amount) || 0;

      db.collection('users').doc(uid).get().then(function(userSnap) {
        if (!userSnap.exists) {
          throw new Error('USER_NOT_FOUND');
        }
        return db.collection('deposits').doc(deposit.id).get();
      }).then(function(depSnap) {
        if (!depSnap.exists) {
          throw new Error('DEPOSIT_NOT_FOUND');
        }
        if (depSnap.data().status !== 'pending') {
          throw new Error('ALREADY_PROCESSED');
        }

        var batch = db.batch();
        batch.update(db.collection('users').doc(uid), {
          balance: firebase.firestore.FieldValue.increment(amt),
          deposited: firebase.firestore.FieldValue.increment(amt)
        });
        batch.update(db.collection('deposits').doc(deposit.id), {
          status: 'approved',
          approvedAt: new Date().toISOString()
        });
        return batch.commit();
      }).then(function() {
        return db.collection('transactions').add({
          userId: uid,
          type: 'deposit',
          amount: amt,
          status: 'approved',
          utr: deposit.utr || '',
          timestamp: new Date().toISOString()
        }).catch(function(e) {
          console.warn('Transaction log failed:', e);
        });
      }).then(function() {
        hideLoading();
        showToast('✅ Deposit Approved! ₹' + amt + ' added to ' + u.name, 'linear-gradient(135deg,#00c853,#00e676)');
        loadDeposits();
      }).catch(function(error) {
        hideLoading();
        var msg = error.message || String(error);

        if (msg === 'USER_NOT_FOUND') {
          showAlert('❌', 'User Not Found!', 'Approval stopped. User does not exist in database. Deposit stayed PENDING.');
        } else if (msg === 'DEPOSIT_NOT_FOUND') {
          showAlert('❌', 'Deposit Not Found', 'This deposit no longer exists.');
        } else if (msg === 'ALREADY_PROCESSED') {
          showAlert('⚠️', 'Already Processed', 'Someone already approved/rejected this deposit. Please refresh.');
          loadDeposits();
        } else {
          showAlert('❌', 'Error', 'Something went wrong: ' + msg);
        }
      });
    }

    function rejectDeposit(id) {
      var deposit = allDeposits.find(function(d) { return d.id === id; });
      if (!deposit) {
        showAlert('❌', 'Error', 'Deposit not found.');
        return;
      }

      if (deposit.status !== 'pending') {
        showAlert('⚠️', 'Already Processed', 'This deposit is already ' + deposit.status + '.');
        loadDeposits();
        return;
      }

      showConfirm('✗', 'Reject Deposit?', 'Reject ₹' + deposit.amount + ' deposit from ' + (deposit.userName || 'User') + '?', 'REJECT', 'popup-btn-danger', function() {
        showLoading('Rejecting...');

        db.collection('deposits').doc(id).get().then(function(doc) {
          if (!doc.exists) throw new Error('Deposit not found');
          if (doc.data().status !== 'pending') throw new Error('ALREADY_PROCESSED');

          return db.collection('deposits').doc(id).update({
            status: 'rejected',
            rejectedAt: new Date().toISOString()
          });
        }).then(function() {
          hideLoading();
          showToast('Deposit Rejected', 'linear-gradient(135deg,#ff3131,#ff5252)');
          loadDeposits();
        }).catch(function(error) {
          hideLoading();
          if (error.message === 'ALREADY_PROCESSED') {
            showAlert('⚠️', 'Already Processed', 'This deposit was already handled.');
            loadDeposits();
          } else {
            showAlert('❌', 'Error', error.message);
          }
        });
      });
    }

    document.getElementById('customPopup').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('show');
    });

    loadDeposits();
  </script>
</body>
  </html>
