<!DOCTYPE html>
<html>
<head>
<title>Cleanup - Prime Arena</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e27;color:white;font-family:Arial;padding:20px;min-height:100vh}
h1{color:#ff3131;text-align:center;margin-bottom:20px;font-size:24px}
.warn{background:rgba(255,49,49,0.15);border:2px solid #ff3131;border-radius:10px;padding:15px;margin-bottom:20px;text-align:center;font-size:13px;line-height:1.6}
.box{background:#1a1f3a;border:1px solid #2a2f4a;border-radius:10px;padding:15px;margin-bottom:15px;font-size:12px;line-height:1.8}
.box b{color:#ffa500}
button{width:100%;padding:18px;border:none;border-radius:10px;font-size:16px;font-weight:bold;color:white;margin-bottom:12px;cursor:pointer}
.btn1{background:#ff3131}
.btn2{background:#ffa500}
.btn3{background:#00c853}
button:active{transform:scale(0.98)}
#log{background:#0a0e27;border:1px solid #ffa500;border-radius:10px;padding:15px;margin-top:15px;font-family:monospace;font-size:11px;line-height:1.7;white-space:pre-wrap;min-height:100px;max-height:400px;overflow-y:auto}
</style>
</head>
<body>

<h1>⚠️ CLEANUP PAGE</h1>

<div class="warn">
<b style="color:#ff3131">DANGER!</b><br>
यह सारा test data delete कर देगा।<br>
<b>वापस नहीं हो सकता!</b>
</div>

<div class="box">
<b>Delete होगा:</b><br>
• users (सारे test users)<br>
• deposits<br>
• withdrawals<br>
• redeem_requests<br>
• matches<br>
• reports<br>
• transactions<br>
• blacklist
</div>

<div class="box">
<b>Safe रहेगा:</b><br>
• faqs<br>
• settings (About, Privacy, Terms, Contact)
</div>

<button class="btn1" onclick="cleanupAll()">🗑️ DELETE ALL TEST DATA</button>
<button class="btn2" onclick="showCounts()">📊 SHOW COUNTS</button>
<button class="btn3" onclick="location.href='admin.html'">← BACK TO ADMIN</button>

<div id="log">Ready...</div>

<script>
var firebaseConfig={apiKey:"AIzaSyC22oO0eveUN3GL9WNtJSzdKghN-X67ZmU",authDomain:"prime-arena-a302b.firebaseapp.com",projectId:"prime-arena-a302b",storageBucket:"prime-arena-a302b.firebasestorage.app",messagingSenderId:"118236794000",appId:"1:118236794000:web:cd0e5bf7503b72f1cf5c15",measurementId:"G-EQJP1D9C92"};

if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();

var list=['users','deposits','withdrawals','redeem_requests','matches','reports','transactions','blacklist'];

function log(msg){
var el=document.getElementById('log');
el.textContent += '\n' + msg;
el.scrollTop = el.scrollHeight;
}

function showCounts(){
document.getElementById('log').textContent='Loading counts...';
var done=0;
list.forEach(function(name){
db.collection(name).get().then(function(snap){
log('• '+name+': '+snap.size+' docs');
}).catch(function(e){
log('• '+name+': ERROR');
});
});
}

function deleteOne(name){
return db.collection(name).get().then(function(snap){
if(snap.empty){
log('✓ '+name+': already empty');
return;
}
log('⏳ '+name+': deleting '+snap.size+' docs...');
var promises=[];
snap.forEach(function(doc){
promises.push(db.collection(name).doc(doc.id).delete());
});
return Promise.all(promises).then(function(){
log('✅ '+name+': DONE');
});
}).catch(function(e){
log('❌ '+name+': '+e.message);
});
}

function cleanupAll(){
if(!confirm('⚠️ पक्का? सारा data delete हो जाएगा!')) return;
if(!confirm('⚠️ आखिरी बार — पक्का delete करना है?')) return;
document.getElementById('log').textContent='Starting...';
var chain=Promise.resolve();
list.forEach(function(name){
chain=chain.then(function(){return deleteOne(name);});
});
chain.then(function(){
log('\n🎉 ALL CLEAN!');
log('अब नया data आएगा — सब fresh!');
});
}

log('Page ready. Click "DELETE ALL TEST DATA" to start.');
log('');
log('Collections to delete: '+list.join(', '));
</script>
</body>
                                                                                       </html>
