<!DOCTYPE html>
<html>
<head>
<title>Referral Tracker - Prime Arena Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e27;color:white;font-family:Arial,sans-serif;padding-bottom:80px;min-height:100vh}
.topbar{display:flex;align-items:center;padding:15px;background:#0d1230;border-bottom:1px solid #2a2f4a;position:sticky;top:0;z-index:100;gap:15px}
.back-btn{font-size:24px;color:white;cursor:pointer}
.topbar-title{font-size:16px;font-weight:bold;display:flex;align-items:center;gap:8px}
.admin-badge{background:linear-gradient(135deg,#ff6b00,#ffa500);color:white;font-size:10px;padding:3px 8px;border-radius:10px;font-weight:bold}
.refresh-btn{background:#2a2f4a;border:none;color:#fff;padding:8px 12px;border-radius:6px;font-size:16px;cursor:pointer;margin-left:auto}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:15px}
.stat{background:#1a1f3a;border:1px solid #2a2f4a;border-radius:10px;padding:12px;text-align:center}
.stat .lbl{font-size:9px;color:#666;margin-bottom:4px}
.stat .val{font-size:20px;font-weight:bold;color:#ffa500}
.filter-tabs{display:flex;padding:0 15px 15px;gap:8px;overflow-x:auto}
.filter-tab{padding:10px 16px;background:#1a1f3a;border:1px solid #2a2f4a;border-radius:20px;font-size:12px;color:#ccc;cursor:pointer;white-space:nowrap;font-weight:bold;transition:.2s}
.filter-tab.active{background:linear-gradient(135deg,#0088cc,#00aaff);color:#fff;border-color:#0088cc}
.search-box{padding:0 15px 15px}
.search-box input{width:100%;padding:13px;background:#1a1f3a;border:1px solid #2a2f4a;border-radius:10px;color:#fff;font-size:13px;outline:none}
.search-box input:focus{border-color:#ffa500}
.referral-list{padding:0 15px}
.ref-card{background:#1a1f3a;border-radius:12px;padding:15px;margin-bottom:12px;border:1px solid #2a2f4a;border-left:4px solid #00aaff}
.ref-card.done{border-left-color:#00c853}
.ref-card.rejected{border-left-color:#ff3131;opacity:.75}
.ref-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.ref-title{font-size:15px;font-weight:bold;color:#fff;display:flex;align-items:center;gap:6px}
.badge{font-size:9px;padding:3px 8px;border-radius:8px;font-weight:bold;text-transform:uppercase}
.badge.code{background:#00c853;color:#fff}
.badge.name{background:#ffa500;color:#fff}
.badge.both{background:linear-gradient(135deg,#6a1b9a,#8e24aa);color:#fff}
.tick{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;background:#00c853;color:#fff;border-radius:50%;font-size:12px;font-weight:bold}
.cross{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;background:#ff3131;color:#fff;border-radius:50%;font-size:12px;font-weight:bold}
.pending-icon{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;background:#ffa500;color:#fff;border-radius:50%;font-size:12px}
.ref-section{background:#0a0e27;border-radius:8px;padding:10px;margin-bottom:10px}
.ref-section:last-child{margin-bottom:0}
.ref-label{font-size:10px;color:#666;letter-spacing:.5px;font-weight:bold;margin-bottom:6px;text-transform:uppercase}
.ref-row{display:flex;font-size:12px;margin-bottom:4px}
.ref-row:last-child{margin-bottom:0}
.ref-row .k{color:#888;width:90px;flex-shrink:0}
.ref-row .v{color:#fff;font-weight:bold;word-break:break-all;flex:1}
.ref-row .v.orange{color:#ffa500}
.ref-row .v.green{color:#00e676}
.ref-row .v.blue{color:#00aaff}
.ref-row .v.gray{color:#666;font-weight:normal}
.status-box{text-align:center;padding:10px;border-radius:8px;font-size:12px;font-weight:bold;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px}
.status-box.given{background:rgba(0,200,83,.15);border:1px solid #00c853;color:#00c853}
.status-box.rejected{background:rgba(255,49,49,.15);border:1px solid #ff3131;color:#ff3131}
.status-box.pending{background:rgba(255,165,0,.15);border:1px solid #ffa500;color:#ffa500}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:12px;border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:bold;cursor:pointer}
.btn-approve{background:linear-gradient(135deg,#00c853,#00e676)}
.btn-reject{background:linear-gradient(135deg,#ff3131,#ff5252)}
.btn:active{transform:scale(.97)}
.empty{text-align:center;padding:60px 20px;color:#666}
.empty .ic{font-size:60px;opacity:.4;margin-bottom:15px}
.empty .t1{font-size:15px;margin-bottom:5px;color:#aaa}
.empty .t2{font-size:12px;color:#555}
.loading{text-align:center;padding:40px;color:#ffa500;font-size:14px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0d1230;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #2a2f4a;z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:#666;font-size:9px;padding:5px 8px;flex:1}
.nav-item.active{color:#ffa500}
.nav-icon{font-size:20px}
</style>
</head>
<body>
<div class="topbar">
<div class="back-btn" onclick="location.href='admin.html'">←</div>
<div class="topbar-title">Referral Tracker<span class="admin-badge">ADMIN</span></div>
<button class="refresh-btn" onclick="loadReferrals()">↻</button>
</div>

<div class="stats">
<div class="stat"><div class="lbl">TOTAL</div><div class="val" id="statTotal">0</div></div>
<div class="stat"><div class="lbl">PENDING</div><div class="val" id="statPending" style="color:#ffa500">0</div></div>
<div class="stat"><div class="lbl">DONE</div><div class="val" id="statDone" style="color:#00c853">0</div></div>
</div>

<div class="filter-tabs">
<div class="filter-tab active" data-filter="pending" onclick="setFilter('pending',this)">⏳ Pending</div>
<div class="filter-tab" data-filter="done" onclick="setFilter('done',this)">✅ Added</div>
<div class="filter-tab" data-filter="rejected" onclick="setFilter('rejected',this)">✗ Rejected</div>
<div class="filter-tab" data-filter="all" onclick="setFilter('all',this)">📋 All</div>
</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="🔍 Referrer name, new user name, email..." oninput="filterList()">
</div>

<div class="referral-list" id="referralList">
<div class="loading">⏳ Loading referrals...</div>
</div>

<div class="bottom-nav">
<div class="nav-item" onclick="location.href='admin.html'"><span class="nav-icon">🏠</span><span>Dashboard</span></div>
<div class="nav-item" onclick="location.href='admin-users.html'"><span class="nav-icon">👥</span><span>Users</span></div>
<div class="nav-item active" onclick="location.href='admin-referrals.html'"><span class="nav-icon">🤝</span><span>Referrals</span></div>
<div class="nav-item" onclick="location.href='admin-deposits.html'"><span class="nav-icon">💳</span><span>Deposits</span></div>
<div class="nav-item" onclick="location.href='admin-settings.html'"><span class="nav-icon">⚙️</span><span>Settings</span></div>
</div>
<script>
var firebaseConfig={apiKey:"AIzaSyC22oO0eveUN3GL9WNtJSzdKghN-X67ZmU",authDomain:"prime-arena-a302b.firebaseapp.com",projectId:"prime-arena-a302b",storageBucket:"prime-arena-a302b.firebasestorage.app",messagingSenderId:"118236794000",appId:"1:118236794000:web:cd0e5bf7503b72f1cf5c15",measurementId:"G-EQJP1D9C92"};

if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();

var allReferrals=[];
var currentFilter='pending';

function esc(s){
if(s===undefined||s===null)return '';
return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(iso){
if(!iso)return '-';
try{
var d=new Date(iso);
if(isNaN(d.getTime()))return '-';
var dd=d.getDate().toString().padStart(2,'0');
var mm=(d.getMonth()+1).toString().padStart(2,'0');
var yy=d.getFullYear();
var hh=d.getHours().toString().padStart(2,'0');
var mn=d.getMinutes().toString().padStart(2,'0');
return dd+'/'+mm+'/'+yy+' '+hh+':'+mn;
}catch(e){return '-';}
}

function getStatus(r){
if(r.referralBonusGiven===true)return 'done';
if(r.referralBonusGiven==='rejected')return 'rejected';
return 'pending';
}

function loadReferrals(){
document.getElementById('referralList').innerHTML='<div class="loading">⏳ Loading referrals...</div>';
db.collection('users').get().then(function(snap){
allReferrals=[];
snap.forEach(function(doc){
var d=doc.data();
d.id=doc.id;
var hasCode=d.referredByCode&&d.referredByCode.trim();
var hasName=d.referredByName&&d.referredByName.trim();
var hasId=d.referredBy&&d.referredBy.trim();
if(hasCode||hasName||hasId){
allReferrals.push(d);
}
});
allReferrals.sort(function(a,b){
return new Date(b.createdAt||0)-new Date(a.createdAt||0);
});
updateStats();
displayReferrals();
}).catch(function(e){
document.getElementById('referralList').innerHTML='<div class="empty"><div class="ic">❌</div><div class="t1">Error: '+esc(e.message)+'</div></div>';
});
}

function updateStats(){
var total=allReferrals.length;
var pending=0,done=0;
allReferrals.forEach(function(r){
var st=getStatus(r);
if(st==='pending')pending++;
else if(st==='done')done++;
});
document.getElementById('statTotal').textContent=total;
document.getElementById('statPending').textContent=pending;
document.getElementById('statDone').textContent=done;
}

function setFilter(filter,el){
currentFilter=filter;
document.querySelectorAll('.filter-tab').forEach(function(t){t.classList.remove('active');});
el.classList.add('active');
displayReferrals();
}

function filterList(){
displayReferrals();
}

function displayReferrals(){
var q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
var list=allReferrals.filter(function(r){
var st=getStatus(r);
if(currentFilter!=='all'&&st!==currentFilter)return false;
if(!q)return true;
return (r.name&&r.name.toLowerCase().indexOf(q)!==-1)||
(r.email&&r.email.toLowerCase().indexOf(q)!==-1)||
(r.phone&&r.phone.indexOf(q)!==-1)||
(r.referredByName&&r.referredByName.toLowerCase().indexOf(q)!==-1)||
(r.referredByCode&&r.referredByCode.toLowerCase().indexOf(q)!==-1);
});
renderList(list);
}

function renderList(list){
var container=document.getElementById('referralList');
if(list.length===0){
var msg='No Referrals Yet';
var sub='When users register with referral info, they will appear here';
if(currentFilter==='pending'){msg='No Pending Referrals';sub='All referrals are processed';}
else if(currentFilter==='done'){msg='No Added Referrals';sub='Referrals with bonus added will appear here';}
else if(currentFilter==='rejected'){msg='No Rejected Referrals';sub='Referrals you reject will appear here';}
container.innerHTML='<div class="empty"><div class="ic">🤝</div><div class="t1">'+msg+'</div><div class="t2">'+sub+'</div></div>';
return;
}

var html='';
list.forEach(function(r){
var hasCode=r.referredByCode&&r.referredByCode.trim();
var hasName=r.referredByName&&r.referredByName.trim();
var status=getStatus(r);

var typeBadge='';
if(hasCode&&hasName){
typeBadge='<span class="badge both">Code + Name</span>';
}else if(hasCode){
typeBadge='<span class="badge code">Via Code</span>';
}else if(hasName){
typeBadge='<span class="badge name">Via Name</span>';
}

var cardClass='';
if(status==='done')cardClass='done';
else if(status==='rejected')cardClass='rejected';

var tickIcon='';
if(status==='done')tickIcon='<span class="tick">✓</span>';
else if(status==='rejected')tickIcon='<span class="cross">✗</span>';
else tickIcon='<span class="pending-icon">⏳</span>';

var statusBox='';
if(status==='done'){
statusBox='<div class="status-box given">✅ Bonus Given — '+fmtDate(r.bonusGivenAt)+'</div>';
}else if(status==='rejected'){
statusBox='<div class="status-box rejected">✗ Rejected — '+fmtDate(r.bonusRejectedAt)+'</div>';
}else{
statusBox='<div class="status-box pending">⏳ Bonus Pending</div>'+
'<div class="actions">'+
'<button class="btn btn-approve" onclick="addBonus(\''+r.id+'\',\''+esc(r.referredBy||'')+'\',\''+esc(r.referredByName||'')+'\',\''+esc(r.name||'')+'\')">✅ Add Bonus</button>'+
'<button class="btn btn-reject" onclick="rejectBonus(\''+r.id+'\')">✗ Reject</button>'+
'</div>';
}

html+='<div class="ref-card '+cardClass+'">'+
'<div class="ref-header">'+
'<div class="ref-title">'+tickIcon+' '+esc(r.name||'Unknown User')+'</div>'+
typeBadge+
'</div>'+

'<div class="ref-section">'+
'<div class="ref-label">🆕 NEW USER (जिसने register किया)</div>'+
'<div class="ref-row"><div class="k">Name:</div><div class="v">'+esc(r.name||'-')+'</div></div>'+
'<div class="ref-row"><div class="k">Email:</div><div class="v blue" style="font-size:11px">'+esc(r.email||'-')+'</div></div>'+
'<div class="ref-row"><div class="k">Phone:</div><div class="v green">'+esc(r.phone||'-')+'</div></div>'+
'<div class="ref-row"><div class="k">Joined:</div><div class="v gray">'+fmtDate(r.createdAt)+'</div></div>'+
'</div>'+

'<div class="ref-section">'+
'<div class="ref-label">🤝 REFERRED BY (किसने भेजा)</div>'+
(hasCode?'<div class="ref-row"><div class="k">Ref. Code:</div><div class="v orange">'+esc(r.referredByCode)+'</div></div>':'')+
(hasName?'<div class="ref-row"><div class="k">Ref. Name:</div><div class="v orange">'+esc(r.referredByName)+'</div></div>':'')+
'</div>'+

statusBox+

'</div>';
});

container.innerHTML=html;
}

function showToast(msg,isError){
var t=document.createElement('div');
t.style.cssText='position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:'+(isError?'#ff3131':'#00c853')+';color:#fff;padding:12px 25px;border-radius:25px;font-size:13px;font-weight:bold;z-index:9999;max-width:90%;text-align:center;box-shadow:0 5px 20px rgba(0,0,0,.5)';
t.textContent=msg;
document.body.appendChild(t);
setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},3000);
}

function showConfirmPopup(title,msg,onConfirm){
var p=document.createElement('div');
p.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);display:flex;justify-content:center;align-items:center;z-index:9999;padding:20px';
var b=document.createElement('div');
b.style.cssText='background:#1a1f3a;border-radius:15px;padding:25px;width:100%;max-width:350px;border:1px solid #ffa500';
var titleEl=document.createElement('div');
titleEl.style.cssText='font-size:18px;font-weight:bold;color:#ffa500;margin-bottom:12px;text-align:center';
titleEl.textContent=title;
var msgEl=document.createElement('div');
msgEl.style.cssText='font-size:14px;color:#ccc;line-height:1.5;margin-bottom:20px;text-align:center;white-space:pre-line';
msgEl.textContent=msg;
b.appendChild(titleEl);
b.appendChild(msgEl);
var row=document.createElement('div');row.style.cssText='display:flex;gap:10px';
var cancelBtn=document.createElement('button');
cancelBtn.textContent='CANCEL';
cancelBtn.style.cssText='flex:1;padding:14px;background:#2a2f4a;border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:bold;cursor:pointer';
cancelBtn.onclick=function(){document.body.removeChild(p);};
var okBtn=document.createElement('button');
okBtn.textContent='CONFIRM';
okBtn.style.cssText='flex:1;padding:14px;background:linear-gradient(135deg,#00c853,#00e676);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:bold;cursor:pointer';
okBtn.onclick=function(){document.body.removeChild(p);if(onConfirm)onConfirm();};
row.appendChild(cancelBtn);
row.appendChild(okBtn);
b.appendChild(row);
p.appendChild(b);
document.body.appendChild(p);
}

function addBonus(referralId,referrerId,referrerName,newUserName){
var msg='"'+newUserName+'" ka bonus add karna hai?';
if(referrerName)msg+='\n\nReferred by: '+referrerName;
msg+='\n\n⚠️ Note: Referrer ko coins manually dena hoga (Admin → Users → Add Coins)';
showConfirmPopup('✅ Add Bonus?',msg,function(){
db.collection('users').doc(referralId).update({
referralBonusGiven:true,
bonusGivenAt:new Date().toISOString()
}).then(function(){
showToast('✅ Bonus added! Card Pending se hata.',false);
loadReferrals();
}).catch(function(e){
showToast('Error: '+e.message,true);
});
});
}

function rejectBonus(referralId){
showConfirmPopup('✗ Reject Bonus?','Is referral ka bonus reject karna hai?\n\nYeh card "Rejected" tab me chala jayega.',function(){
db.collection('users').doc(referralId).update({
referralBonusGiven:'rejected',
bonusRejectedAt:new Date().toISOString()
}).then(function(){
showToast('✗ Bonus rejected!',false);
loadReferrals();
}).catch(function(e){
showToast('Error: '+e.message,true);
});
});
}

loadReferrals();
</script>
</body>
  </html>
