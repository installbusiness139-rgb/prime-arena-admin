<!DOCTYPE html>
<html>
<head>
<title>Admin Login - Prime Arena</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e27;color:#fff;font-family:Arial;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.box{width:100%;max-width:400px}
.logo{text-align:center;margin-bottom:30px}
.logo-icon{width:80px;height:80px;background:linear-gradient(135deg,#ff6b00,#ffa500);border-radius:20px;display:flex;justify-content:center;align-items:center;font-size:40px;margin:0 auto 15px;box-shadow:0 0 30px rgba(255,165,0,.4)}
.logo h1{font-size:24px;color:#ffa500;letter-spacing:2px;margin-bottom:5px}
.logo p{font-size:12px;color:#888;letter-spacing:1px}
.card{background:#1a1f3a;border:1px solid #2a2f4a;border-radius:15px;padding:25px}
.card h2{font-size:16px;color:#ffa500;margin-bottom:20px;text-align:center;letter-spacing:1px}
.fg{margin-bottom:15px}
.fg label{display:block;font-size:11px;color:#aaa;margin-bottom:6px;letter-spacing:.5px}
.fg input{width:100%;padding:14px;background:#0a0e27;border:1px solid #2a2f4a;border-radius:10px;color:#fff;font-size:14px;outline:none;font-family:inherit}
.fg input:focus{border-color:#ffa500}
.login-btn{width:100%;padding:15px;background:linear-gradient(135deg,#ff6b00,#ffa500);border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:bold;cursor:pointer;letter-spacing:1px;margin-top:5px}
.login-btn:disabled{opacity:.5}
.login-btn:active{transform:scale(.98)}
.err{background:rgba(255,49,49,.15);border:1px solid #ff3131;color:#ff3131;font-size:12px;padding:10px;border-radius:8px;margin-bottom:12px;text-align:center;display:none;line-height:1.4}
.err.show{display:block}
.back{text-align:center;margin-top:15px}
.back a{color:#888;font-size:12px;text-decoration:none}
</style>
</head>
<body>
<div class="box">
<div class="logo">
<div class="logo-icon">🔐</div>
<h1>PRIME ARENA</h1>
<p>ADMIN ACCESS</p>
</div>

<div class="card">
<h2>ADMIN LOGIN</h2>
<div class="err" id="errMsg"></div>
<div class="fg">
<label>ADMIN PASSWORD</label>
<input type="password" id="adminPass" placeholder="Enter admin password" autocomplete="off">
</div>
<button class="login-btn" id="loginBtn" onclick="adminLogin()">LOGIN</button>
</div>

<div class="back">
<a href="home.html">← Back to App</a>
</div>
</div>

<script>
var ADMIN_PASSWORD="prime@2026";
var SESSION_KEY="primeArenaAdmin";

function showErr(m){
var e=document.getElementById('errMsg');
e.textContent=m;
e.classList.add('show');
}

function adminLogin(){
var pass=document.getElementById('adminPass').value;
var btn=document.getElementById('loginBtn');
document.getElementById('errMsg').classList.remove('show');

if(!pass){
showErr('Please enter password');
return;
}

btn.disabled=true;
btn.textContent='CHECKING...';

setTimeout(function(){
if(pass===ADMIN_PASSWORD){
try{
sessionStorage.setItem(SESSION_KEY,'true');
localStorage.setItem(SESSION_KEY,'true');
}catch(e){}
btn.textContent='SUCCESS!';
btn.style.background='linear-gradient(135deg,#00c853,#00e676)';
setTimeout(function(){
window.location.href='admin.html';
},500);
}else{
btn.disabled=false;
btn.textContent='LOGIN';
showErr('Wrong password! Try again.');
document.getElementById('adminPass').value='';
}
},300);
}

document.getElementById('adminPass').addEventListener('keypress',function(e){
if(e.key==='Enter')adminLogin();
});
</script>
</body>
</html>
